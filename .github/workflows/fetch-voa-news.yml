name: Fetch VOA Learning English news

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 05:00 (GMT+7) mỗi ngày
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-voa-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch VOA RSS feeds
        run: python3 scripts/fetch_voa_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "voa-news-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/voa-news.json; then
            echo "No changes to data/voa-news.json"
          else
            git add data/voa-news.json
            git commit -m "chore: update VOA Learning English news data"
            git push
          fi
