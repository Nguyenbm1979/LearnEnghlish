name: Diagnose VOA feed (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install playwright@1.47 && npx playwright install --with-deps chromium
      - name: Test live login flow
        run: node scripts/_diag5.mjs > diagnostic-output.txt 2>&1
      - name: Commit output
        if: always()
        run: |
          git config user.name "voa-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostic-output.txt
          git commit -m "chore: diagnostic output" || echo "nothing to commit"
          git push
