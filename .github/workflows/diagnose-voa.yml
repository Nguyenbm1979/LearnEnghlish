name: Diagnose VOA feed (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump raw item structure
        run: |
          UA="Mozilla/5.0 (compatible; LearnEnglishAppBot/1.0)"
          {
            echo "=== breakingnewsenglish raw (first item) ==="
            curl -sS -A "$UA" "https://breakingnewsenglish.com/bne.xml" | python3 -c "
import sys,xml.etree.ElementTree as ET
root = ET.fromstring(sys.stdin.read())
item = root.find('./channel/item')
print(ET.tostring(item, encoding='unicode'))
"
            echo "=== newsinlevels raw (first item) ==="
            curl -sS -A "$UA" "https://www.newsinlevels.com/feed/" | python3 -c "
import sys,xml.etree.ElementTree as ET
root = ET.fromstring(sys.stdin.read())
item = root.find('./channel/item')
print(ET.tostring(item, encoding='unicode'))
"
          } > diagnostic-output.txt 2>&1
      - name: Commit output
        run: |
          git config user.name "voa-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostic-output.txt
          git commit -m "chore: diagnostic output" || echo "nothing to commit"
          git push
