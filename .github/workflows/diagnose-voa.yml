name: Diagnose VOA feed (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe children's story sources
        run: python3 scripts/_diag14.py > diagnostic-output.txt 2>&1
      - name: Commit output
        if: always()
        run: |
          git config user.name "voa-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostic-output.txt
          git commit -m "chore: diagnostic output" || echo "nothing to commit"
          git push
